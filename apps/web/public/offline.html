<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <title>Bol-Bill · Offline</title>
  <style>
    @media (prefers-color-scheme: light) { body { background: #f2f3f6 !important; color: #13161b !important; } a { background: #d3d9e2 !important; color: #13161b !important; } p[style] { color: #566070 !important; } }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #0f1115; color: #f5f5f4; font: 17px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    main { max-width: 360px; }
    h1 { font-size: 26px; margin: 0 0 8px; }
    a, button { display: block; box-sizing: border-box; width: 100%; min-height: 56px; margin-top: 12px; padding: 14px; border: 0; border-radius: 14px; font: inherit; font-weight: 700; text-align: center; text-decoration: none; background: #2a2f38; color: #f5f5f4; }
    button { background: #f5a524; color: #1c1408; }
  </style>
</head>
<body>
  <main>
    <h1>Internet nahi hai</h1>
    <p>Bolkar bill banane ke liye internet chahiye. Aapka khata aur samaan phone mein safe hai aur bina internet ke khul sakte hain.</p>
    <p style="color:#a8a29e">You are offline. Speaking needs internet; the ledger and catalog still open.</p>
    <a href="/ledger">Khata kholo (Ledger)</a>
    <a href="/catalog">Samaan kholo (Catalog)</a>
    <button type="button" onclick="location.reload()">Dobara try karo (Retry)</button>
  </main>
</body>
</html>
