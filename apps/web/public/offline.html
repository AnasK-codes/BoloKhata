<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#eeeef0" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f0f11" media="(prefers-color-scheme: dark)" />
  <title>Bol-Bill · Offline</title>
  <style>
    /* Same tokens as the app (globals.css), so this page looks like part of it. */
    :root { --base: #eeeef0; --card: #fff; --ink: #151517; --dim: #505057; --control: #ededf0; --line: #e2e2e6; --accent: #202024; --on: #fff; }
    @media (prefers-color-scheme: dark) { :root { --base: #0f0f11; --card: #1a1a1d; --ink: #f4f4f6; --dim: #c6c6cd; --control: #2d2d33; --line: #36363d; --accent: #f1f1f4; --on: #101012; } }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: var(--base); color: var(--ink); font: 17px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Noto Sans Devanagari', sans-serif; }
    main { max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 28px; padding: 28px 24px; }
    h1 { font-size: 26px; line-height: 1.15; margin: 0 0 8px; letter-spacing: -.03em; }
    p { margin: 0 0 12px; }
    .en { color: var(--dim); font-size: 15px; }
    a, button { display: block; box-sizing: border-box; width: 100%; min-height: 56px; margin-top: 10px; padding: 14px; border: 0; border-radius: 16px; font: inherit; font-weight: 700; text-align: center; text-decoration: none; background: var(--control); color: var(--ink); cursor: pointer; }
    button { background: var(--accent); color: var(--on); }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Internet nahi hai</h1>
    <p>Bolkar bill banane ke liye internet chahiye. Aapka khata aur samaan phone mein safe hai aur bina internet ke khul sakte hain.</p>
    <p class="en">You are offline. Speaking needs internet; the ledger and catalog still open.</p>
    <a href="/ledger">Khata kholo (Ledger)</a>
    <a href="/catalog">Samaan kholo (Catalog)</a>
    <button type="button" onclick="location.reload()">Dobara try karo (Retry)</button>
  </main>
</body>
</html>
