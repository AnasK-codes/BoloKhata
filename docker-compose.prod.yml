# Three application containers on one EC2 instance; hosted Supabase supplies accounts/profiles.
#   caddy (TLS + reverse proxy)  ->  web (Next.js)  and  gateway (realtime WebSocket)
# Usage:  docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Needs .env (see docs/DEPLOY.md and docs/AUTH.md). Gnani/LLM secrets remain gateway-only.

name: bolbill

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Sized for a 2 GB instance with swap: caddy 256 MB + gateway 512 MB + web 768 MB.
    mem_limit: 256m
    depends_on:
      web:
        condition: service_healthy
      gateway:
        condition: service_healthy
    logging: *logging

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    restart: unless-stopped
    init: true
    # Longer than DRAIN_TIMEOUT_MS so the graceful drain can finish before Docker kills it.
    stop_grace_period: 30s
    mem_limit: 512m
    env_file: .env
    environment:
      PORT: "8080"
      # Heap below the container limit, so Node collects before the kernel kills it.
      NODE_OPTIONS: --max-old-space-size=384
      TRUST_PROXY: "true"
      # The volume, whatever .env says (the working directory in the image is not writable).
      GNANI_TTS_CACHE_DIR: /data/tts-cache
      # Daily credit counters survive restarts and redeploys (same volume).
      CREDIT_USAGE_FILE: /data/tts-cache/credit-usage.json
      # Same-origin: the browser origin is the site itself.
      ALLOWED_ORIGINS: https://${DOMAIN}
    expose:
      - "8080"
    volumes:
      - tts_cache:/data/tts-cache
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging: *logging

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_GATEWAY_URL: https://${DOMAIN}
    restart: unless-stopped
    init: true
    mem_limit: 768m
    # Only account-backend settings go to Next's server. Gnani/LLM keys stay on the gateway.
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL in .env}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?set SUPABASE_ANON_KEY in .env}
      GATEWAY_INTERNAL_URL: http://gateway:8080
      APP_ORIGIN: https://${DOMAIN}
      # TEMPORARY demo switch: true turns login off (see docs/AUTH.md). Default is off.
      DEMO_NO_AUTH: ${DEMO_NO_AUTH:-false}
      NODE_OPTIONS: --max-old-space-size=512
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  tts_cache:
